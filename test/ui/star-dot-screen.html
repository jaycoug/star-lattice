<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Star-Dot Screen Preview</title>
  <link rel="stylesheet" href="../../shared/ui/starDotScreen.css">
  <style>
    :root { --bg: #f4f5f8; --surface: #ffffff; --ink: #1d2330; --muted: #6b7385; --line: #d9dde5; --accent: #3b6fd8; --gold: #b8860b; color-scheme: light; }
    :root[data-theme="dark"] { --bg: #111820; --surface: #18212b; --ink: #e4e9f0; --muted: #8d99a8; --line: #2c3a48; --accent: #6aa5e8; --gold: #e6b93c; color-scheme: dark; }
    body { margin: 0; padding: 16px; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, sans-serif; }
    .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
    .bar button { padding: 4px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); font: inherit; cursor: pointer; }
    .bar button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
    .note { color: var(--muted); }
    #toast { position: fixed; bottom: 16px; left: 16px; }
  </style>
</head>
<body>
  <div class="bar" id="bar"></div>
  <div id="screen"></div>
  <div id="toast" hidden></div>
  <script type="module">
    // Preview of the shared star-dot screen with sample data, outside the program. Changes are
    // kept in memory only (reload to start over).
    import * as E from '../../shared/engine/index.js';
    import { h } from '../../shared/dom.js';
    import { starDotScreen } from '../../shared/ui/starDotScreen.js';

    const content = E.normalizeContent({
      format: E.CONTENT_FORMAT, id: 'preview', title: 'Preview',
      categories: [['Career', '#ff4d9e'], ['Tech Skills', '#ff763b'], ['Logistics', '#ccb300'], ['School', '#1edc2b'], ['Health', '#198cff'], ['Fun', '#cc6ded']].map(([name, color]) => ({ name, color })),
      properties: [
        { id: 'environment', choices: [{ name: 'Office' }, { name: 'Kitchen' }, { name: 'Den' }, { name: 'Local' }, { name: 'Distant' }] },
        { id: 'difficulty', choices: [{ name: 'Small' }, { name: 'Medium' }, { name: 'Large' }] },
      ],
    });
    const now = Date.now();
    let st = E.newSave(content, 'Preview').state;
    const kites = E.centralStar(st).kites;
    const place = (k, slot, name) => { let id; [st, id] = E.placeDot(st, kites[k], slot, name); return id; };
    const main = place(3, E.ZENITH, 'Statistics');
    const others = [place(1, 0, 'R'), place(1, 1, 'Python'), place(4, 3, 'Social Connection'), place(0, 2, 'Interview Prep')];
    st = E.updateDot(st, main, {
      description: 'Week 9 coursework and exam prep.\nLecture videos, homework and code drills.',
      props: { environment: 'office', finance: { amount: -40, period: 'month' }, persistence: 'weekly', difficulty: 'medium' },
    });
    const child = (parent, name, patch = {}) => { let id; ({ state: st, dot: id } = E.addChild(st, parent, name)); st = E.updateDot(st, id, patch); return id; };
    const videos = child(main, '7 lecture videos (20–30 min each)');
    const hw = child(main, 'HW9: 3 questions', { role: 'assess', marks: ['time'] });
    const q1 = child(hw, 'Question 1'); child(hw, 'Question 2'); child(hw, 'Question 3', { props: { difficulty: 'hard' } });
    st = E.checkDot(st, q1, true, now);
    st = E.addDotNote(st, hw, 'Lecture slides, week 9');
    st = E.addDotNote(st, hw, 'Office hours Thursday');
    child(main, 'Drill R code for the procedures', { props: { difficulty: 'hard' } });
    child(main, 'Final exam', { role: 'assess', marks: ['time', 'place'], props: { difficulty: 'hard' } });
    child(main, 'Buy the exam calculator', { marks: ['money', 'place'] });
    st = E.checkDot(st, videos, true, now);
    st = E.addRelation(st, main, others[0], 5, 'All homework is done in R.');
    st = E.addRelation(st, main, others[1], 3, 'Same methods, different language.');
    st = E.addRelation(st, main, others[2], 2);
    st = E.addRelation(st, others[3], main, 4, 'Talking through the analysis is good interview practice.');

    let current = main;
    let edit = location.search.includes('edit');   // ?edit opens it in the editing view
    let ui = {};
    const history = [];
    const opts = E.optionsFrom(content, { now });
    const render = () => {
      document.getElementById('bar').replaceChildren(
        h('button', { 'aria-pressed': String(!edit), onclick: () => { edit = false; render(); } }, 'App view (fixed)'),
        h('button', { 'aria-pressed': String(edit), onclick: () => { edit = true; render(); } }, 'Dashboard view (editable)'),
        h('button', { onclick: () => { const r = document.documentElement; r.dataset.theme = r.dataset.theme === 'dark' ? 'light' : 'dark'; } }, 'Light / dark'),
        h('span', { class: 'note' }, 'Sample data, in memory only.'));
      document.getElementById('screen').replaceChildren(starDotScreen({
        state: st, view: E.derive(st, opts), content, dotId: current, edit, ui, now: Date.now(),
        change: fn => { st = fn(st); render(); },
        setUi: patch => { ui = { ...ui, ...patch }; render(); },
        open: d => { history.push(current); current = d; ui = {}; render(); },
        back: history.length ? () => { current = history.pop(); ui = {}; render(); } : null,
      }));
    };
    render();
  </script>
</body>
</html>
